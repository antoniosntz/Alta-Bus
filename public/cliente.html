<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AltaBus - Rastreamento</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div id="map"></div>

  <div class="iphone-container">
    <button class="btn-voltar-topo" onclick="voltar()">
      <i class="bx bx-chevron-left"></i> Voltar
    </button>

    <div class="logo-area">
      <h2>AltaBus</h2>
    </div>

    <div class="ponto-card">
      <p>Seu Ponto de Embarque</p>
      <h3 id="ponto" class="ponto-nome">Carregando...</h3>
      <p style="margin-top:10px; font-size:12px; opacity:0.8;">Última atualização</p>
      <h3 id="atualizacao" class="ponto-nome">--</h3>
    </div>

    <div class="content-info">
      <div class="info-box">
        <i class="bx bx-move-horizontal"></i>
        <p>Distância</p>
        <h3 id="distancia">-- km</h3>
      </div>

      <div class="info-box">
        <i class="bx bx-time-five"></i>
        <p>Tempo</p>
        <h3 id="tempo">-- min</h3>
      </div>

      <div class="info-box status-box">
        <i class="bx bx-broadcast"></i>
        <h3 id="status">Calculando...</h3>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const pontos = [
      { nome:"Ponto 1 - Posto Castelinho", lat:-20.521139, lng:-40.985417 },
      { nome:"Ponto 2 - Posto Beira Rio", lat:-20.596750, lng:-41.023194 },
      { nome:"Ponto 3 - Campo de fruteiras", lat:-20.604611, lng:-41.028278 },
      { nome:"Ponto 4 - Departamento", lat:-20.618194, lng:-41.024694 },
      { nome:"Ponto 5 - Rancho da Lagoa", lat:-20.627472, lng:-41.016222 },
      { nome:"Ponto 6 - Ponte do AYD", lat:-20.636999, lng:-41.014028 },
      { nome:"Ponto 7 - Supermercado da Vila Esperança", lat:-20.655694, lng:-41.019333 },
      { nome:"Ponto 8 - Rodoviária de Vargem Alta", lat:-20.673694, lng:-41.010972 },
      { nome:"Ponto 9 - Oficina Jacigua", lat:-20.706889, lng:-41.027472 },
      { nome:"Ponto 10 - Casarão", lat:-20.705000, lng:-41.019889 },
      { nome:"Ponto 11 - Bar do Machados", lat:-20.705500, lng:-41.017694 },
      { nome:"Ponto 12 - Bar da Linha", lat:-20.710750, lng:-41.016222 },
      { nome:"Ponto 14 - CEET Giuseppe Altoe", lat:-20.721583, lng:-41.010861 }
    ];

    const coordenadasSalvas = localStorage.getItem("pontoCoordenadas");
    let pontoSelecionadoUsuario = null;

    if (coordenadasSalvas) {
      const [latS, lngS] = coordenadasSalvas.split(',').map(Number);
      pontoSelecionadoUsuario = pontos.find(p => p.lat === latS && p.lng === lngS);

      if (pontoSelecionadoUsuario) {
        document.getElementById("ponto").innerText = pontoSelecionadoUsuario.nome;
      }
    }

    const map = L.map('map', { zoomControl: false }).setView([-20.721583, -41.010861], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const busStopIcon = L.divIcon({
      className: 'ponto-icon',
      iconSize: [10, 10],
      iconAnchor: [5, 5]
    });

    pontos.forEach(p => {
      L.marker([p.lat, p.lng], { icon: busStopIcon }).addTo(map).bindPopup(p.nome);
    });

    const redBusIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
      iconSize: [45, 45],
      iconAnchor: [22, 45],
      popupAnchor: [0, -45]
    });

    const markerOnibus = L.marker([-20.721583, -41.010861], { icon: redBusIcon })
      .addTo(map)
      .bindPopup("Ônibus AltaBus");

    const markerPontoUsuario = L.circleMarker([0, 0], {
      radius: 12,
      color: '#38bdf8',
      fillColor: '#38bdf8',
      fillOpacity: 0.4
    }).addTo(map);

    if (pontoSelecionadoUsuario) {
      markerPontoUsuario.setLatLng([pontoSelecionadoUsuario.lat, pontoSelecionadoUsuario.lng]);
    }

    async function atualizarDados() {
      const nomeDoPonto = pontoSelecionadoUsuario ? pontoSelecionadoUsuario.nome : null;

      if (!nomeDoPonto) {
        document.getElementById("status").innerText = "Ponto não selecionado";
        return;
      }

      try {
        const resposta = await fetch(`/tempo?ponto=${encodeURIComponent(nomeDoPonto)}`);

        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();

        if (!dados.success) {
          throw new Error(dados.message || "Falha ao buscar dados");
        }

        document.getElementById("distancia").innerText = dados.distancia_km + " km";
        document.getElementById("tempo").innerText = dados.tempo_min + " min";
        document.getElementById("status").innerText = dados.status_texto || "A caminho...";

        if (dados.onibus && dados.onibus.lat && dados.onibus.lng) {
          const posicaoOnibus = [dados.onibus.lat, dados.onibus.lng];
          markerOnibus.setLatLng(posicaoOnibus);

          if (pontoSelecionadoUsuario) {
            const bounds = L.latLngBounds([
              posicaoOnibus,
              [pontoSelecionadoUsuario.lat, pontoSelecionadoUsuario.lng]
            ]);
            map.fitBounds(bounds, { padding: [40, 40] });
          }
        }

        if (dados.onibus && dados.onibus.fixTime) {
          const data = new Date(dados.onibus.fixTime);
          document.getElementById("atualizacao").innerText = data.toLocaleString("pt-BR");
        } else {
          document.getElementById("atualizacao").innerText = "--";
        }

      } catch (e) {
        console.error("Erro na atualização dos dados:", e);
        document.getElementById("status").innerText = "Erro ao conectar";
        document.getElementById("atualizacao").innerText = "--";
      }
    }

    function voltar() {
      window.location.href = "pontos.html";
    }

    setTimeout(() => {
      map.invalidateSize();
    }, 500);

    setInterval(atualizarDados, 5000);
    atualizarDados();
  </script>
</body>
</html>
